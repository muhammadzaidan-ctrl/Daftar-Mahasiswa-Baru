<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png">
    <title>Daftar MABA 2025 - SMA Bina Insan Mandiri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Popup -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-popup neo-box">
            <h2>Login Required</h2>
            <p>Anak luminare atau IOS nihhhh... Login sesuai panduan ya gess...</p>
            
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="neo-inset" placeholder="Masukkan username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="neo-inset" placeholder="Masukkan password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
                </div>
                
                <button type="submit" class="login-btn">
                    <span class="btn-text">Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Detail Popup Mahasiswa -->
    <div class="detail-overlay" id="detailOverlay" style="display:none;">
        <div class="detail-popup neo-box">
            <button class="close-detail" onclick="closeDetailPopup()">&times;</button>
            <div id="detailInfo"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <header class="neo-box">
            <div style="font-weight: bold; font-size: 18px; color: #2d3748;">SMA BINA INSAN MANDIRI</div>
            <nav class="navigation">
                <a href="#" onclick="navigateTo('home')">Home</a>
                <a href="#" onclick="navigateTo('about')">About</a>
                <a href="#" onclick="navigateTo('services')">Services</a>
                <a href="#" onclick="navigateTo('contact')">Contact</a>
                <button class="neo-btn logout-btn" onclick="logout()">Logout</button>
            </nav>
        </header>

        <div class="controls-container neo-box">
            <input type="text" id="searchInput" class="neo-inset search-bar" placeholder="🔍 Cari nama, jurusan, atau universitas..." onkeyup="searchCards()">
            <div class="filter-tags" id="filterTags">
                <button class="neo-btn filter-tag active" onclick="filterByCampus('All', this)">Semua Kampus</button>
                <button class="neo-btn filter-tag" onclick="filterByCampus('Universitas Airlangga', this)">Universitas Airlangga</button>
                <button class="neo-btn filter-tag" onclick="filterByCampus('Universitas Negeri Malang', this)">Universitas Negeri Malang</button>
                <button class="neo-btn filter-tag" onclick="filterByCampus('Universitas Brawijaya', this)">Universitas Brawijaya</button>
            </div>
        </div>

        <!-- Alumni Grid Cards -->
        <div class="cards-grid" id="alumniGrid">
            <!-- Cards will be generated dynamically via JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
